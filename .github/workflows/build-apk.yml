# Builds the Android APK on GitHub's servers. Runs on every upload (push) or by hand from the Actions tab.
# When it finishes: the APK is on the repository's Releases page (and under the run's "Artifacts").
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write          # lets the build publish the APK (or its error log) as a release - a plain download link

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools
          pip install buildozer "cython<3"

      # Android has no Windows fonts: bundle two open-licensed (SIL OFL) Google fonts with Japanese / display glyphs
      - name: Fonts
        run: |
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/DotGothic16-Regular.ttf https://github.com/google/fonts/raw/main/ofl/dotgothic16/DotGothic16-Regular.ttf
          curl -fL -o assets/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: NeonRonin-apk
          path: bin/*.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neon Ronin (build ${{ github.run_number }})
          files: bin/*.apk

      # if anything breaks, publish the end of the build log so it can be read without logging in
      - name: Publish the error log
        if: failure()
        shell: bash
        run: tail -n 400 build.log > build-error.log || echo "no build.log" > build-error.log

      - name: Upload the error log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Build log ${{ github.run_number }} (failed)
          prerelease: true
          files: build-error.log
